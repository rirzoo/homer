[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homer-mail"
version = "0.1.0"
description = "Multi-account mail CLI: Gmail/IMAP and Microsoft 365 (Outlook) from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
homer = "homer.cli:main"

[tool.setuptools]
packages = ["homer"]
